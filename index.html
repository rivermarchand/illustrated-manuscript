<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illustrated Manuscript</title>
  <style>
    @font-face {
      font-family: 'Furia';
      src: url('/src/furia-iii.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #f4eee0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
    }
    .attribution {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Furia', serif;
      font-size: 14px;
      color: #2a1a0a;
      z-index: 10;
      pointer-events: none;
    }
    .attribution a {
      color: #2a1a0a;
      text-decoration: none;
      pointer-events: auto;
    }
    .attribution a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <canvas id="manuscript"></canvas>
  <div class="attribution">(Click for fire)<br>By <a href="https://neithernor.studio/" target="_blank">Neither/Nor</a></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
